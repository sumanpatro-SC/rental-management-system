<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentalHub | Management System</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" href="/">
       <i class="fa-solid fa-house-chimney-window me-2"></i>RentalHub
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link px-3" href="/"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/rentals"><i class="fa-solid fa-list me-1"></i> Rentals</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/add"><i class="fa-solid fa-plus-circle me-1"></i> Add New</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="/billing"><i class="fa-solid fa-file-invoice-dollar me-1"></i> Billing</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  {% block content %}{% endblock %}
</main>

<footer class="footer mt-auto py-4 bg-white border-top">
  <div class="container text-center">
    <span class="text-muted small">© 2026 Rental Management System • Developed by <span class="text-primary fw-bold">P Suman Patro</span></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
