{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4">
                    <i class="fa-solid fa-pen-to-square text-success fs-3 me-2"></i>
                    <h3 class="mb-0 fw-bold">Edit Property</h3>
                </div>

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Property Title</label>
                        <input type="text" class="form-control" name="title" value="{{ rental.title }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" name="description" rows="2">{{ rental.description }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Rent Price (₹)</label>
                            <input type="number" step="0.01" class="form-control" name="price" value="{{ rental.rent_price }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Status</label>
                            <select class="form-select" name="status">
                                <option value="Available" {% if rental.status == 'Available' %}selected{% endif %}>Available</option>
                                <option value="Rented" {% if rental.status == 'Rented' %}selected{% endif %}>Rented</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Billing Date</label>
                        <input type="text" class="form-control" name="billing_date" value="{{ rental.billing_date }}">
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success text-white fw-bold">Update Details</button>
                        <a href="/rentals" class="btn btn-link text-decoration-none text-muted">Go Back</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
